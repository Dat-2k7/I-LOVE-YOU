<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LAST CHAPTER</title>
    <style>
        :root {
            --neon-cyan: #00cec9;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #d4e09b;
            /* 1. SỬA NỀN BƠ: Đảm bảo đường dẫn này khớp với file bạn up */
            background-image: url('Gemini_Generated_Image_k1negnk1negnk1ne.png');
            background-size: 200px;
            background-repeat: repeat;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* 2. SỬA LỖI MÀU XANH: Giảm độ mờ từ 0.88 xuống 0.3 để thấy ảnh bơ bên dưới */
            background: rgba(212, 224, 155, 0.3); 
            z-index: 0;
            pointer-events: none; /* Để không chặn bấm nút */
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 300px;
            text-align: center;
        }

        .thank-you-message {
            background: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .media-item {
            background: #fff;
            padding: 5px;
            border-radius: 10px;
        }

        .media-item video, .media-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        .timeline-box {
            position: fixed;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 320px;
            text-align: center;
        }

        .music-controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 100;
            background: #1e272e;
            padding: 10px 20px;
            border-radius: 40px;
        }

        .btn-neon {
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        #playBtn { width: 50px; height: 50px; font-size: 20px; }

        .broken-heart {
            position: fixed;
            bottom: -50px;
            font-size: 24px;
            z-index: 2;
            animation: flyUp linear forwards;
        }

        @keyframes flyUp {
            to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="content">
    <div class="thank-you-message">
        Cảm ơn Heo đã cho anh biết thế nào là yêu... Anh thành thật xin lỗi và chúc Heo sẽ hạnh phúc!!! 😔💔
    </div>

    <div class="container">
        <div class="media-item"><video src="assets/videos/MP1.mp4" controls></video></div>
        <div class="media-item"><video src="assets/videos/MP6.mp4" controls></video></div>
        <div class="media-item"><img src="assets/images/IMG1.jpg"></div>
        <div class="media-item"><img src="assets/images/IMG2.jpg"></div>
    </div>
</div>

<div class="timeline-box">
    <div style="color: #588157;">The begin: 16/11/2024</div>
    <div style="color: #bc4749;">The end: 28/12/2025</div>
</div>

<div class="music-controls">
    <div class="btn-neon" onclick="prevTrack()">❮</div>
    <div class="btn-neon" id="playBtn" onclick="togglePlay()">▶</div>
    <div class="btn-neon" onclick="nextTrack()">❯</div>
</div>

<audio id="bgMusic"></audio>

<script>
    const music = document.getElementById("bgMusic");
    const playBtn = document.getElementById("playBtn");

    /* 3. SỬA LỖI NHẠC: Copy chính xác tên file từ GitHub của bạn */
    const tracks = [
        "Đừng Nói - Đình Dũng [LYRIC VIDEO] #DN.mp3.m4a",
        "QUANG ĐĂNG TRẦN - ANH ĐÃ KHÔNG BIẾT CÁCH YÊU EM _ Official Lyrics Video.mp3"
    ];

    let currentTrack = 0;
    music.src = tracks[currentTrack];

    function togglePlay() {
        if (music.paused) {
            // Quan trọng: Trình duyệt chỉ cho phát khi bạn bấm nút này
            music.play().then(() => {
                playBtn.innerHTML = "||";
            }).catch(err => {
                alert("Lỗi: Không tìm thấy file nhạc hoặc trình duyệt chặn!");
            });
        } else {
            music.pause();
            playBtn.innerHTML = "▶";
        }
    }

    function loadTrack(index) {
        currentTrack = index;
        music.src = tracks[currentTrack];
        music.play();
        playBtn.innerHTML = "||";
    }

    function nextTrack() {
        currentTrack = (currentTrack + 1) % tracks.length;
        loadTrack(currentTrack);
    }

    function prevTrack() {
        currentTrack = (currentTrack - 1 + tracks.length) % tracks.length;
        loadTrack(currentTrack);
    }

    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "broken-heart";
        heart.innerHTML = "💔"; 
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }, 600);
</script>

</body>
</html>
